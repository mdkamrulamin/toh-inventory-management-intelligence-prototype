[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F7"
textColor = "#1F2937"
font = "sans-serif"

# Body text: approximately 12.75 pt.
baseFontSize = 17

# Main title, role headings, and section headings.
headingFontSizes = ["32px", "27px", "24px", "21px", "19px", "17px"]